[project]
name = "checkbox-detection"
version = "0.1.0"
description = "HTTP service that finds checkboxes in form images and says whether each is checked"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pypdfium2>=5.14",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]  # ships no type hints
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
