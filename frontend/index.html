      THESIS: The service reads a form the way a corrector reads a galley proof: every box gets a pencil mark on the page and a numbered note in the margin. It refuses the gray SaaS dashboard with colored status chips.
      OWN-WORLD: Neutral proof paper and ink, one blue pencil for marks (hatched = checked, open = unchecked), a vermilion pencil only for low-confidence boxes, crop marks, pixel rulers on the sheet edges, Archivo set wide.
      STORY: Drop a form, watch the reading rule pass, then check any mark against the page: hover a note, its box is circled, the rulers and slip give its coordinates and confidence.
      FIRST VIEWPORT: Left, a wide heavy headline and a blank sheet in crop marks as the drop target with its Browse action. Right, a marked 1004 fragment with its proof margin drawing itself in.
